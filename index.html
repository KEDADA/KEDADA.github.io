<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <meta
      name="description"
      content="汪柯廷的个人作品集，聚焦 Agent Harness、Agent Memory、RAG 与评测工程。"
    />
    <meta property="og:title" content="汪柯廷 · AI Portfolio" />
    <meta
      property="og:description"
      content="Agent Harness × Agent Memory — 项目、研究与成长时间轴"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/portrait.jpg" />
    <title>汪柯廷 · AI Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="data.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#timeline">跳到成长时间轴</a>

    <main>
      <section class="hero" aria-labelledby="hero-name">
        <div class="hero-glow hero-glow-blue" aria-hidden="true"></div>
        <div class="hero-glow hero-glow-warm" aria-hidden="true"></div>

        <div class="hero-inner">
          <div class="hero-copy reveal">
            <div class="eyebrow">
              <span class="status-dot" aria-hidden="true"></span>
              <span id="eyebrow-text">INTERVIEW PORTFOLIO · 2026</span>
            </div>

            <h1 id="hero-name">汪柯廷</h1>
            <p class="hero-tagline" id="hero-tagline"></p>
            <p class="hero-summary" id="hero-summary"></p>

            <div class="hero-actions" aria-label="主要链接">
              <a class="button button-primary" href="#timeline">
                探索时间轴 <span aria-hidden="true">↓</span>
              </a>
              <a class="button button-secondary" id="github-link" target="_blank" rel="noreferrer">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.87c-2.78.6-3.37-1.18-3.37-1.18-.45-1.15-1.11-1.46-1.11-1.46-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.64-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.6 9.6 0 0 1 12 6.84a9.5 9.5 0 0 1 2.5.34c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.86v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>
                GitHub
              </a>
              <a class="button button-secondary" href="#achievements">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6V2Zm8 2v3h3l-3-3ZM9 11h7V9H9v2Zm0 4h7v-2H9v2Zm0 4h5v-2H9v2Z"/></svg>
                成果
              </a>
            </div>
          </div>

          <div class="metrics-grid reveal reveal-delay" id="hero-metrics" aria-label="关键成果"></div>
        </div>

        <a class="scroll-cue" href="#timeline" aria-label="滚动到成长时间轴">
          <span>SCROLL</span>
          <span aria-hidden="true">⌄</span>
        </a>
      </section>

      <section class="timeline-section" id="timeline" aria-labelledby="timeline-title">
        <div class="section-heading reveal-on-scroll">
          <div class="section-mark" aria-hidden="true"><i></i><b></b><i></i></div>
          <h2 id="timeline-title">成长时间轴</h2>
          <p>顺着时间线，一段一段讲述我的经历与思考</p>
        </div>

        <div class="filter-tabs reveal-on-scroll" id="filters" role="tablist" aria-label="按类型筛选"></div>
        <ol class="timeline-list" id="timeline-list" aria-label="时间轴节点"></ol>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <section class="footer-section" aria-labelledby="stack-title">
          <h2 id="stack-title">技术栈</h2>
          <div class="stack-grid" id="skills-grid"></div>
        </section>

        <section class="footer-section" id="achievements" aria-labelledby="achievement-title">
          <h2 id="achievement-title">荣誉与成就</h2>
          <div class="achievement-grid" id="achievement-grid"></div>
        </section>

        <section class="contact-card" aria-labelledby="contact-title">
          <div>
            <h3 id="contact-title">联系我</h3>
            <p>如果您对我的研究方向或项目经历感兴趣，欢迎随时联系我。</p>
          </div>
          <div class="contact-links">
            <a id="footer-github" target="_blank" rel="noreferrer">GitHub ↗</a>
            <a id="email-link">Email ↗</a>
            <a id="phone-link">电话 ↗</a>
          </div>
        </section>

        <div class="footer-bottom">
          <p>© <span id="copyright-year"></span> 汪柯廷 · Built with care for clarity</p>
          <p>持续探索可靠、可评测、可进化的 Agent 系统</p>
        </div>
      </div>
    </footer>

    <dialog class="detail-modal" id="detail-modal" aria-labelledby="modal-title">
      <button class="modal-close" type="button" aria-label="关闭详情">×</button>
      <div class="modal-content">
        <div class="modal-meta" id="modal-meta"></div>
        <h2 id="modal-title"></h2>
        <p class="modal-org" id="modal-org"></p>
        <p class="modal-description" id="modal-description"></p>
        <div class="modal-metrics" id="modal-metrics"></div>
        <ul class="modal-details" id="modal-details"></ul>
      </div>
    </dialog>
  </body>
</html>
