<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f4">
  <meta name="description" content="汪柯廷的 Agent 工程个人主页：Agent Harness、长期记忆、RAG 与自动化评测。">
  <link rel="canonical" href="https://kedada.github.io/">
  <title>汪柯廷 · Agent 工程作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header" aria-label="主导航">
    <a class="brand" href="#top" aria-label="返回首页">汪柯廷</a>
    <nav class="nav-links" aria-label="页面章节">
      <a href="#timeline">经历与作品</a>
      <a href="#stack">技能</a>
      <a href="#honors">荣誉</a>
      <a href="#contact">联系</a>
    </nav>
  </header>

  <main id="main">
    <section class="hero" id="top" aria-labelledby="hero-title">
      <div class="hero-copy reveal">
        <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span><span id="profile-label"></span></p>
        <h1 id="hero-title"></h1>
        <p class="hero-role" id="profile-tagline"></p>
        <p class="hero-intro" id="profile-summary"></p>
        <div class="hero-actions">
          <a class="button button-primary" href="#timeline">探索经历与作品 <span aria-hidden="true">↓</span></a>
          <a class="button button-secondary" href="#opensource">开源项目 <span aria-hidden="true">↓</span></a>
        </div>
      </div>

      <div class="proof-wrap reveal reveal-delay" aria-label="代表性成果">
        <div class="proof-grid" id="proof-grid"></div>
      </div>
      <a class="scroll-cue" href="#timeline">Scroll <span aria-hidden="true">↓</span></a>
    </section>

    <section class="timeline-section" id="timeline" aria-labelledby="timeline-title">
      <header class="timeline-heading reveal-on-scroll">
        <p class="section-kicker">Journey &amp; Work</p>
        <h2 id="timeline-title">经历与作品</h2>
        <p>沿着学习、工程实践、研究与开源，一次看清我的 Agent 工程路径。</p>
      </header>
      <div class="filter-tabs reveal-on-scroll" id="filters" role="tablist" aria-label="按类型筛选"></div>
      <ol class="timeline-list" id="timeline-list" aria-label="经历与作品时间轴"></ol>
    </section>

    <section class="support-section reveal-on-scroll" id="stack" aria-labelledby="stack-title">
      <header class="support-heading"><p class="section-kicker">Skills</p><h2 id="stack-title">专业技能</h2></header>
      <div class="capability-list" id="skills-grid"></div>
    </section>

    <section class="support-section reveal-on-scroll" id="honors" aria-labelledby="honors-title">
      <header class="support-heading"><p class="section-kicker">Honors</p><h2 id="honors-title">荣誉与成果</h2></header>
      <div class="honor-list" id="achievement-grid"></div>
    </section>
  </main>

  <footer class="site-footer" id="contact">
    <div class="contact-heading">
      <p class="section-kicker">Contact</p>
      <h2>联系我</h2>
      <p>电子科技大学计算机硕士 · 关注 Agent Harness、长期记忆与自动化评测</p>
    </div>
    <div class="contact-links">
      <a id="email-link"><span>邮箱</span><strong id="email-text"></strong><i aria-hidden="true">↗</i></a>
      <a id="phone-link"><span>电话</span><strong id="phone-text"></strong><i aria-hidden="true">↗</i></a>
      <a id="github-link" target="_blank" rel="noreferrer"><span>个人 GitHub 主页</span><strong>KEDADA</strong><i aria-hidden="true">↗</i></a>
    </div>
    <p class="copyright">© <span id="copyright-year"></span> 汪柯廷</p>
  </footer>

  <div class="modal-backdrop" id="detail-backdrop" hidden>
    <section class="detail-modal" id="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detail-title" tabindex="-1">
      <button class="modal-close" type="button" aria-label="关闭详情">×</button>
      <div id="detail-content"></div>
    </section>
  </div>

  <script src="./data.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
